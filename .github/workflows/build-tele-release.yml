name: build and release to Telegram
run-name: 'Release: Build ${{ github.event.inputs.version }} for S10,N10 Series'

on:
  workflow_dispatch:
    inputs:      
      version:
        description: 'Release Version'
        required: true        

env:
  BUILD_KERNEL_VERSION: ${{ github.event.inputs.version }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        device: [beyond2, beyond1, beyond0, beyondxks, d1, d2s, d1x, d2x]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt update -y  
          sudo apt install libncurses5-dev -y
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb         
          
      - name: Set environment variable
        run: |
          SHA=$(git rev-parse --short $GITHUB_SHA)
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$SHA" >> $GITHUB_ENV
          
      - name: Building Kernel
        run: |
          bash build.sh ${{ matrix.device }}

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: "MencretKernel-${{ env.BUILD_KERNEL_VERSION }}-${{ env.BUILD_DATE }}-${{ matrix.device }}-stock-One-UI"
          path: "build/*.tar"

  telegram-notification:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_KERNEL_VERSION: ${{ github.event.inputs.version }}
      BUILD_DATE: ${{ needs.build.outputs.build_date }}

    steps:
      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Upload to Telegram Group
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            🚀 <b>MencretKernel ${{ env.BUILD_KERNEL_VERSION }} - Build Completed!</b>
            📱 <b>Supported Devices:</b> d1, d2s, d1x, d2x (Note10), beyond2, beyond1, beyond0, beyondxks (S10)
            ⚙️ <b>Version:</b> ${{ env.BUILD_KERNEL_VERSION }}
            📅 <b>Build Date:</b> ${{ env.BUILD_DATE }}
            🔗 <b>Release:</b> <a href="https://github.com/${{ github.repository }}/releases">GitHub</a>

  release:
    needs: build  # Hanya perlu build, tidak perlu telegram-notification
    runs-on: ubuntu-latest
    permissions:
      contents: write    

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: "MencretKernel-${{ github.event.inputs.version }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}  # Gunakan GITHUB_TOKEN default
          artifacts: "artifacts/**/*.tar"
          body: |
            MencretKernel ${{ github.event.inputs.version }}
            Build Date: $(date +'%Y-%m-%d')
            Commit: ${{ github.sha }}