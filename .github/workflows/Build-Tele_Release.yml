name: build and release to Telegram

on:
  workflow_dispatch:
    inputs:      
      tag:
        description: 'Release Tag'
        required: true        

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        device: [beyond2, beyond1, beyond0, beyondxks, d1, d2s, d1x, d2x]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt update -y  
          sudo apt install libncurses5-dev -y
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb         
          
      - name: Set environment variable
        run: |
          echo "BUILD_KERNEL_VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          
      - name: Building Kernel
        run: |
            bash build.sh ${{ matrix.device }}

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: "MencretKernel-${{ env.BUILD_KERNEL_VERSION }}-${{ matrix.device }}-stock-One-UI"
          path: |
            build/*.tar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Telegram Group (Pre-Release Announcement)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            🚀 <h1><b>MencretKernel ${{ github.event.inputs.version }} - Build Completed!</b></h1>
            
            📱 <b>Supported Devices:</b>
            • d1, d2s, d1x, d2x (Note10 Series)
            • beyond2, beyond1, beyond0, beyondxks (S10 Series)
            
            ⚙️ <b>Build Details:</b>
            • Kernel Name: BatAxeKernel
            • Version: ${{ github.event.inputs.version }}
            • KernelSU: ${{ github.event.inputs.ksun }}
            • Clang: ${{ github.event.inputs.llvm }}
            • Build Date: ${{ env.BUILD_DATE }}
            
            📦 <b>Status:</b> Preparing GitHub Release...
            
            🔗 <b>Release will be available soon at:</b>
            <a href=https://github.com/${{ github.repository }}/releases>HERE</a>
            
            💬 <b>For Discussion:</b>
            https://t.me/PapaL3xaKernel/2            

            <b>Repository:</b> <a href="https://github.com/${{ github.repository }}">MencretKernel</a>
            
            <b>Commit SHA:</b> <a href="https://github.com/${{ github.repository }}/commit/${{github.sha}}">Click here</a>
            
            <b>Installation Guide:</b> <a href="https://telegra.ph/BatAxeKernel-Installation-Guide-10-02">Click here</a>

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "MencretKernel-stock-One-UI-${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          token: ${{ secrets.TOKEN }}          
          artifacts: "artifacts/**/*.tar"
          body: "Commit SHA: ${{ github.sha }}"

      - name: Upload to Telegram Group (Release Confirmation)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            ✅ <h1><b>MencretKernel ${{ github.event.inputs.version }} Successfully Released!</b></h1>
            
            📥 <b>Download Now:</b>
            <a href="https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}">DOWNLOAD FROM GITHUB</a>
            
            🎉 <b>Release is now live and available for download!</b>
            
            Built by <b><a href="https://github.com/${{ github.repository }}">PapaL3xa</a></b>
